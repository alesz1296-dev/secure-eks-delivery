name: Terraform security and deployment

on:
  pull_request:
    paths: ["infra/**", "bootstrap/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["infra/**", "bootstrap/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-analysis:
    name: Terraform static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow syntax
        uses: raven-actions/actionlint@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: Terraform init (offline validation)
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: Run TFLint
        working-directory: infra
        run: |
          tflint --init
          tflint --format compact
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.30
      - name: Run Checkov
        run: checkov -d infra --framework terraform --compact
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: Terraform plan
    needs: static-analysis
    # Remote planning remains manual until the repository-scoped AWS OIDC role
    # and protected Terraform state backend are configured.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      # Configure a repository-scoped AWS OIDC role here before enabling remote plans.
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -no-color -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra/tfplan
          retention-days: 14

  apply:
    name: Terraform apply
    needs: [static-analysis, plan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      # Configure the approved AWS OIDC role here; never use long-lived keys.
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
