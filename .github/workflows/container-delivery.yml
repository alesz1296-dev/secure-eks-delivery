name: Container delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/container-delivery.yml"

# No repository write permission is required. The publish job requests an OIDC
# token only after validation succeeds and the protected environment permits it.
permissions:
  contents: read

jobs:
  quality:
    name: Application quality and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked runtime dependencies and test tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check pytest==8.3.5 httpx==0.28.1 ruff pip-audit
      - name: Lint Python
        run: ruff check app tests
      - name: Run unit tests
        run: pytest -q
      - name: Audit locked Python dependencies
        run: pip-audit -r requirements.lock

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-publish:
    name: Build, scan, and publish immutable image
    needs: [quality, secrets]
    runs-on: ubuntu-latest
    environment: container-delivery
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            --tag secure-eks-delivery:ci \
            .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-eks-delivery:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-eks-delivery:ci
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"
      - name: Upload Trivy and SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-security-evidence-${{ github.sha }}
          path: |
            trivy-results.sarif
            image-sbom.cdx.json
          retention-days: 14
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify publisher identity and repository
        run: |
          aws sts get-caller-identity
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION"
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and publish immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          GIT_TAG: git-${{ github.sha }}
          BUILD_TAG: build-${{ github.run_number }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker tag secure-eks-delivery:ci "$IMAGE:$GIT_TAG"
          docker tag secure-eks-delivery:ci "$IMAGE:$BUILD_TAG"
          docker push "$IMAGE:$GIT_TAG"
          docker push "$IMAGE:$BUILD_TAG"
      - name: Record immutable ECR digest
        env:
          GIT_TAG: git-${{ github.sha }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GIT_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ECR_REPOSITORY:$GIT_TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
