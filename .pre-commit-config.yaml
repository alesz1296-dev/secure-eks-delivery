default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
        files: \.tf$

      - id: tflint
        name: tflint
        entry: tflint --chdir=infra
        language: system
        pass_filenames: false
        files: ^infra/.*\.tf$

      - id: checkov
        name: checkov terraform scan
        entry: 'C:/Users/alesz/AppData/Local/pipx/pipx/venvs/checkov/Scripts/python.exe -m checkov.main -d infra --framework terraform --compact'
        language: system
        pass_filenames: false
        files: ^infra/.*\.tf$

      - id: gitleaks
        name: gitleaks working-tree scan
        entry: gitleaks dir . --no-banner --redact
        language: system
        pass_filenames: false
        files: .*

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
