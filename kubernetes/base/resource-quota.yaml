apiVersion: v1
kind: ResourceQuota
metadata:
  name: secure-eks-delivery-quota
  namespace: secure-eks-delivery
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: 1Gi
    limits.memory: 2Gi

    #not really needed since app is stateless, but just in case we add a persistent volume claim to the deployment in the future, we can set a limit here
    #persistentvolumeclaims: "2"
    #requests.storage: 10Gi
