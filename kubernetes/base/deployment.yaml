# TODO: Define the FastAPI Deployment.
# Include non-root securityContext, probes, resource limits, and immutable image settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-eks-delivery
  namespace: secure-eks-delivery
  labels:
    app.kubernetes.io/name: secure-eks-delivery
    app.kubernetes.io/part-of: secure-eks-delivery
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-eks-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-eks-delivery
        app.kubernetes.io/part-of: secure-eks-delivery
    spec:
      serviceAccountName: secure-eks-delivery
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: 535079145207.dkr.ecr.us-east-1.amazonaws.com/secure-eks-delivery-dev-fastapi@sha256:edb8ff20850eac39fdd047777e86c5a2c0a9f96167fcf1a09712b2f78991dccd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: APP_VERSION
              value: "local"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
