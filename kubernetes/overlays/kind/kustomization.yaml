apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Kind nodes have the locally loaded image; do not contact a remote registry.
images:
  - name: 535079145207.dkr.ecr.us-east-1.amazonaws.com/secure-eks-delivery-dev-fastapi
    newName: secure-eks-delivery
    newTag: metrics

patches:
  - target:
      kind: Deployment
      name: secure-eks-delivery
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kind-metrics
