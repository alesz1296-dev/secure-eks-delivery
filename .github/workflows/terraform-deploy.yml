name: Terraform deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Show GitHub OIDC context
        run: |
          echo "repository=${{ github.repository }}"
          echo "environment=terraform-plan"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::535079145207:role/secure-eks-delivery-dev-github-plan
          aws-region: us-east-1
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - working-directory: infra
        run: terraform init -input=false
      - working-directory: infra
        run: terraform plan -input=false -no-color -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra/tfplan
          retention-days: 14

  # Apply is intentionally disabled while the production OIDC role,
  # protected environment, approval path, and cost controls are being tested.
