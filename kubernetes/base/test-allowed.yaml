apiVersion: v1
kind: Pod
metadata:
  name: test-allowed
  namespace: secure-eks-delivery
  labels:
    access: api-client #gives access to the application via the allow-api-client-egress NetworkPolicy
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100 # This protects against a container process having unnecessary root privileges. Running as a non-root user is a security best practice.
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
      command: ["sleep", "300"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
