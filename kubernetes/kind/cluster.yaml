kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Pin the local Kubernetes version for reproducible cluster recreation.
image: kindest/node:v1.36.1

nodes:
  - role: control-plane
  - role: worker
  - role: worker

networking:
  # Cilium will provide the CNI and NetworkPolicy enforcement.
  disableDefaultCNI: true

  # Local ranges separate from the AWS VPC and EKS service ranges.
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

  # Keep kube-proxy for the initial networking milestone.
  kubeProxyMode: "iptables"
