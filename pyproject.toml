[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-eks-delivery"
version = "0.1.0"
description = "Minimal FastAPI workload for the Secure EKS Delivery Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.149.0",
  "uvicorn==0.34.0",
  "httptools==0.6.4",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "watchfiles==1.3.0",
  "websockets==17.3",
  "prometheus-client==0.23.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
