apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secure-eks-delivery

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow-dns.yaml
  - network-allow-api.yaml
  - networkpolicy-allow-api-client-egress.yaml #allow rules for api-client pods to access the application on port 8080
  - networkpolicy-allow-prometheus.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - servicemonitor.yaml
