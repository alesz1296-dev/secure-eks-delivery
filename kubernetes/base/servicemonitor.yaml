apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: secure-eks-delivery
  namespace: secure-eks-delivery
  labels:
    # Selected by the kube-prometheus-stack Prometheus instance.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-eks-delivery
  namespaceSelector:
    matchNames:
      - secure-eks-delivery
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
